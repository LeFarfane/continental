<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Continental</title>
<link rel="stylesheet" href="/static/continental.css">
</head>
<body>
<main>
  <h1>Continental</h1>
  <p class="sub">La suite de operación de la farmacia.</p>

  <section>
    <h2>Pedido sugerido</h2>
    <p class="corte" id="corte">Armando la lista…</p>
    <!-- QUÉ TAN RECIENTES SON LAS VENTAS (ticket 29). Pegado al corte porque
         lo explica: la lista del viernes vista un lunes por la mañana dice si
         eso es lo normal o si falta algo que ya debía haber llegado. -->
    <p class="nota" id="pedido-ventas" hidden></p>
    <!-- DOYLE NO CONTESTA (ticket 29). Arriba de la tabla y no abajo en
         "Módulos", que es donde se decía antes: quien trabaja la lista tiene
         que saber que los precios no están disponibles antes de mirarlos. -->
    <p class="nota" id="pedido-doyle" hidden></p>
    <!-- Lo que no se pudo leer y NO tumbó la lista: los precios o los pedidos
         guardados. Sin esto su vacío se leería como un dato. -->
    <div id="pedido-avisos" hidden></div>
    <p class="armado" id="armado" hidden></p>
    <div class="cierre" id="cierre" hidden>
      <button type="button" id="cerrar">Cerrar la lista</button>
      <span class="detalle" id="cierre-detalle"></span>
    </div>
    <div class="vistas" id="vistas" role="radiogroup" aria-label="Qué se muestra en la lista" hidden></div>
    <p class="nota" id="pedido-nota" hidden></p>
    <p class="nota" id="pedido-sin-clasificar" hidden></p>
    <!-- Cuántos renglones quedaron SIN COMPARAR (ticket 15). Va aquí arriba,
         antes de la tabla, porque la casilla lo pide así: se tiene que ver de
         un vistazo y sin abrir renglón por renglón. -->
    <p class="nota" id="pedido-sin-comparar" hidden></p>
    <!-- CÓMO LE FUE AL LOTE DE ANOCHE (ticket 19, ADR 0007). Va debajo del
         conteo de huecos porque lo EXPLICA: el conteo dice cuántos renglones
         están sin comparar y esto dice por qué. Se escribe también cuando el
         lote fue bien, por lo mismo que el conteo: callar en el caso bueno
         dejaría el silencio con dos significados —"corrió y le fue bien" y
         "esta pantalla no lo cuenta"— y el encargado no puede distinguirlos. -->
    <p class="nota" id="pedido-corrida" hidden></p>
    <!-- EL BOTÓN DE COMPLETAR SOLO LOS FALTANTES, y los proveedores a los que
         se les caducó la sesión. Los dos juntos y en un solo recuadro porque
         son el mismo momento del día: el encargado llega, ve que media lista
         no tiene precio, y lo arregla desde aquí. Separarlos mandaría a buscar
         el segundo botón al final de la página. -->
    <div class="completar" id="completar" hidden></div>
    <!-- Lo que salió mal al descartar o al devolver. Aparte de las otras dos
         notas porque es pasajero y de otra naturaleza: aquéllas describen la
         lista, ésta describe un clic que no llegó. -->
    <p class="nota" id="pedido-accion" hidden></p>
    <table id="pedido-tabla" hidden>
      <caption id="pedido-resumen"></caption>
      <thead>
        <tr>
          <th class="clave">Clave</th>
          <th>Producto</th>
          <th class="numero">Existencia</th>
          <th class="numero">Días de cobertura</th>
          <th class="cantidad">Cantidad a pedir</th>
          <th class="precios">Precio de proveedor</th>
          <th class="proveedor">Se le pide a</th>
          <th class="acciones">Quitar</th>
        </tr>
      </thead>
      <tbody id="pedido-renglones"></tbody>
    </table>
    <!-- EN QUÉ SE PARTE LA LISTA (ticket 20). Debajo de la tabla y no arriba:
         primero se decide a quién se le pide cada renglón y después se mira en
         cuántos pedidos queda y cuánto suma cada uno. Lo de dentro se pinta
         entero desde el servidor: ni un total se calcula aquí. -->
    <!-- LO QUE VIENE EN CAMINO DE LISTAS ANTERIORES (ticket 24). Pegado a la
         tabla porque explica lo que NO está en ella: esos productos se
         vendieron y no se proponen porque ya se pidieron. Atenuado, no
         escondido. Se pinta una sola vez, al cargar: partir, enviar y tachar
         no lo cambian. -->
    <!-- LO QUE PROBABLEMENTE YA LLEGÓ (ticket 26). Arriba de lo que viene en
         camino porque es lo que se atiende: una compra de SICAR encaja con un
         renglón en tránsito, y una persona la confirma o la rechaza. Nada pasa
         a recibido solo. Se pinta con la carga, igual que el bloque de abajo. -->
    <div class="en-camino recepcion" id="recepcion" hidden></div>
    <div class="en-camino" id="en-camino" hidden></div>
    <div class="particion" id="particion" hidden></div>
    <details class="descartados" id="descartados" hidden>
      <summary id="descartados-resumen"></summary>
      <ul id="descartados-lista"></ul>
    </details>
  </section>

  <section>
    <h2>Estado</h2>
    <ul id="estado"><li><span class="punto"></span><span class="detalle">Consultando…</span></li></ul>
  </section>

  <section>
    <h2>Módulos</h2>
    <ul id="modulos"><li><span class="punto"></span><span class="detalle">Consultando…</span></li></ul>
  </section>
</main>

<script src="/static/continental.js"></script>
</body>
</html>
