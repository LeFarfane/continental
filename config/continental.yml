# Configuración de Continental. Sin secretos: lo que lleva contraseña vive en
# `.env` (ver `.env.example`).

# Dónde está cada módulo. Loopback siempre: nada de esto es alcanzable desde
# fuera, y esa es justamente la razón por la que los módulos no llevan
# autenticación propia (regla 2 de CLAUDE.md, ADR 0001).
modulos:
  doyle:
    url: "http://127.0.0.1:8383"
    # Una búsqueda en un portal tiene un piso medido de ~9 s por proveedor
    # (5.6 s de scroll de carga diferida + 3 s de cortesía) y un techo de
    # 60-90 s si se estiran los timeouts. Por eso la web de Doyle no contesta
    # la búsqueda de golpe: devuelve un `job_id` y se le pregunta después.
    # Este timeout es para las llamadas cortas -pedir el estado, listar
    # sesiones-, no para esperar un resultado.
    timeout_seg: 10
  marlowe:
    url: "http://127.0.0.1:8484"
    timeout_seg: 10

# A QUIÉN AVISARLE cuando algo falla y desde la pantalla no hay nada más que
# hacer (ticket 29): "Si sigue igual, avísale <esto>." Es una FRASE, con su
# "a" por delante, y no un nombre ni un teléfono escritos en el código: el día
# que cambie quién administra atlas, cambia aquí y en ningún otro lado. Si
# falta, la pantalla dice "a quien administra atlas".
a_quien_avisar: "a quien administra atlas"

# El módulo de Pedido. El porqué de cada número está en
# docs/decisiones/0002-pedido-sugerido-por-reposicion-de-lo-vendido.md.
pedido:
  # Cuántos días de venta toma el PRIMER pedido sugerido, cuando todavía no hay
  # un cierre anterior desde el cual acumular. Después de esa primera vez,
  # siempre acumula desde el último cierre -con el hueco de fin de semana,
  # mirar solo "el último día" tiraría las ventas del sábado al piso-.
  #
  # ERA 7 HASTA EL 2026-09-20, y se bajó a 1 por decisión del dueño. Siete días
  # era razonable cuando no había historia de cierres, y es una mala primera
  # impresión: la primerísima lista propondría una semana entera de ventas de
  # golpe sobre un anaquel que ya se repuso solo durante esa semana. Pediría de
  # más, y eso es lo primero que el encargado vería de la herramienta.
  #
  # UN DÍA AQUÍ YA ES "UN DÍA HÁBIL", sin necesidad de saber de calendarios.
  # La ventana termina en `max(fecha)` de las ventas, así que su último día
  # SIEMPRE tiene ventas: los domingos y los feriados no pueden caer ahí. Se
  # midió el 2026-09-20 con el 16 de septiembre -Independencia-, que en el
  # almacén se ve idéntico a un domingo: cero filas.
  #
  # Y ojo con la lectura contraria, que es la trampa: un día con cero filas NO
  # quiere decir "cerraron". El sábado 2026-09-19 también tenía cero, porque el
  # respaldo de SICAR no sale en sábado y todavía no había llegado. Lo que
  # distingue "cerrado" de "todavía no llega" es `max(fecha)`, no el conteo.
  dias_primera_vez: 1

  # Tope del lote nocturno de precios (ticket 18, lo lee
  # `continental.lote.tope_del_lote_segundos`). Lo que no alcanzó queda marcado
  # sin precio -con el motivo `no alcanzo el tiempo`, no como un error- y con
  # su botón para completarlo a mano: un lote a medias que lo dice es mejor que
  # uno que se estira hasta la mañana.
  #
  # El tope se mira ANTES de arrancar cada renglón y nunca en medio de uno:
  # cortar una consulta a la mitad dejaría a Doyle con navegadores abiertos y
  # tiraría una búsqueda que ya costó ~9 s por proveedor. Así que el lote se
  # puede pasar por lo que tarde el renglón en curso, acotado por el
  # `consulta_de_precio.tope_seg` de aquí abajo.
  #
  # SI SE SUBE ESTE NÚMERO, hay que subir también el `TimeoutStartSec` de
  # `scripts/systemd/continental-lote.service`: `Type=oneshot` usa ese valor
  # para MATAR el proceso, y si se queda corto el tope de aquí no se llega a
  # cumplir nunca. Hay una prueba que comprueba que el de la unidad sea mayor.
  tope_lote_minutos: 60

  # CUÁNDO UN RENGLÓN EN TRÁNSITO SE SEÑALA COMO ATRASADO (ticket 25, ADR 0013):
  # cuando lleva MÁS de estos días en camino, contados en días de calendario de
  # la farmacia (UTC-6). Con 7, el séptimo día todavía no; el octavo sí. Es lo
  # que enciende el botón de "devolver a la lista" de ese renglón.
  #
  # SIETE, Y NO ESTÁ MEDIDO: hasta el ticket 26 nada se marca como recibido, así
  # que no hay un solo tiempo de entrega guardado del cual sacar el número. Se
  # eligió con tres razones y ningún dato:
  #
  # - Una semana cubre cualquier combinación de día de la semana, fin de semana
  #   largo y puente: el aviso no se enciende sobre una entrega normal.
  # - MIENTRAS NO HAYA RECEPCIÓN, TODO LO QUE LLEGÓ SIGUE "EN TRÁNSITO" y a los
  #   N días se ve atrasado igual que lo que no llegó. Devolver a la lista algo
  #   que sí llegó es volverlo a pedir entero. Un número chico encendería el
  #   botón sobre casi todo, muy pronto; uno de una semana lo enciende solo
  #   sobre lo que lleva demasiado para ser una entrega de mayorista.
  # - A los siete días la pantalla ya escribe la fecha con los días que lleva
  #   en vez del día de la semana (`transito.DIAS_CON_NOMBRE`), así que el
  #   renglón atrasado siempre enseña su número.
  #
  # CONDICIÓN DE REVISIÓN: cuando el ticket 26 tenga un mes de recepciones,
  # medir de enviado_en a la recepción y poner aquí algo por encima de lo que
  # tardan casi todos. Si el botón se usa sobre cosas que sí llegaron, este
  # número está bajo.
  #
  # UN ENTERO Y NADA MÁS. Si falta o está mal escrito ("7", 7.5, cero) la
  # pantalla NO inventa uno: enseña lo que viene en camino sin decir qué está
  # atrasado, y dice por qué. Ver `dias_en_transito_para_atrasado_configurados`.
  dias_en_transito_para_atrasado: 7

  # El botón "completar lo que falta" (ticket 19). Vuelve a consultar SOLO los
  # renglones a los que volver a preguntar puede cambiarles algo -sin lectura,
  # o con huecos de los tres que se arreglan reintentando- y nunca los que ya
  # tienen precio: eso serían cuatro visitas a portales ajenos para ganar como
  # mucho una cotización más.
  completar:
    # Cuánto puede durar UNA vuelta del botón. Es distinto del tope del lote y
    # a propósito: el lote corre de noche con el horario entero por delante, y
    # esto lo aprieta una persona que está esperando, a media mañana y con la
    # farmacia abierta.
    #
    # A ~36 s por renglón -cuatro portales a ~9 s- veinte minutos son unos
    # treinta renglones. Lo que no alcance NO deja fila y no se inventa
    # ninguna: se cuenta, se dice, y el botón sigue ahí.
    #
    # El tope se mira ANTES de arrancar cada renglón y nunca en medio de uno,
    # igual que el del lote y por lo mismo: cortar una consulta a la mitad
    # tiraría una búsqueda que ya costó ~9 s por proveedor.
    tope_minutos: 20

  # Consultar el precio de UN renglón en Doyle (ticket 12). Esto no es el lote:
  # es el botón que el encargado aprieta cuando quiere el precio de algo
  # concreto, sin esperar a la noche.
  consulta_de_precio:
    # Cuánto se espera como mucho a que Doyle termine una búsqueda. El piso
    # medido es de ~9 s por proveedor y el techo de 60-90 s si se estiran los
    # timeouts; 120 va POR ENCIMA de ese techo a propósito, porque cortar en 90
    # dejaría sin precio justo las búsquedas más lentas, que son las que nadie
    # va a repetir a mano.
    #
    # Nada de esto cuelga la pantalla: quien espera es un hilo de Continental y
    # el navegador pregunta cómo va. Lo que este numero decide es cuánto tarda
    # en aparecer el hueco cuando un portal se queda colgado.
    tope_seg: 120
    # Cada cuánto se le pregunta a Doyle. Es el mismo intervalo que usa la
    # propia pantalla de Doyle y la llamada que cuesta es un GET por loopback,
    # que tarda menos de un milisegundo.
    cada_seg: 1

  # EL PUENTE ENTRE LAS CLAVES DE DOYLE Y LOS PROVEEDORES DE SICAR (ticket 20,
  # ADR 0008). A la izquierda la clave con la que habla toda la comparación
  # -la misma de `precio_de_proveedor.proveedor` y la de
  # `config/proveedores.yml` de Doyle-; a la derecha el `pro_id` de SICAR, que
  # es `marts.dim_proveedor.proveedor_id`.
  #
  # Hasta el ticket 20 este cruce NO EXISTÍA EN NINGUNA PARTE, y hacía falta
  # para poder escribir una fila de `pedidos.pedido`.
  #
  # SE GUARDA EL ID Y NO EL NOMBRE, y ésa es la decisión: el `pro_id` no cambia
  # cuando SICAR renombra a un proveedor, y un puente por nombre se rompería
  # con el primer acento corregido. El nombre se lee de `dim_proveedor` cada
  # vez, y solo para pintarlo.
  #
  # Medido contra `marts.dim_proveedor` en atlas el 2026-09-19: 22 filas.
  #
  # **QuePharma NO ESTÁ, y no es un olvido de este archivo**: la farmacia nunca
  # le ha comprado, así que SICAR no tiene una fila suya -y el ADR 0002 ya daba
  # por probable que QuePharma quedara fuera de la comparación-. Se le puede
  # pedir igual: el pedido se arma con `proveedor_id` en NULL y la pantalla
  # dice que SICAR no lo conoce. Nunca un cero inventado (regla 4).
  #
  # El día que la farmacia le compre a QuePharma, SICAR le va a dar un `pro_id`
  # y lo único que hay que hacer es agregar la línea aquí. Nada de código.
  proveedores_en_sicar:
    nadro: 1
    vicma: 8
    levic: 10
    # quepharma: <sin pro_id todavía>

  # Anaqueles que cuentan como "medicamento" para el toggle. Es una lista
  # blanca a propósito: lo que no está aquí y tampoco es abarrote se muestra
  # como `sin clasificar`, nunca se esconde. Ver CONTEXT.md.
  anaqueles_medicamento:
    - "PATENTE"      # PATENTE 1 a 6
    - "GENERICO"     # GENERICO 1 a 4
    - "NATURISTA"
    - "BOTICA"       # BOTICA 1 a 3 — material de curación, se compra a los
                     # mismos proveedores, así que entra
    - "VITRINA"      # VITRINA 1 a 3

  # Abarrote: compite contra la tienda de la esquina, no contra una farmacia, y
  # no se le compra a un proveedor de medicamentos. La regla es la misma que
  # usa el grupo 1 de la canasta A8 (Marlowe/sql/canasta.sql), para que las dos
  # no divergan.
  anaqueles_abarrote:
    - "SUPER"
    - "CANASTA"
    - "REFRIGERADOR"
  categorias_abarrote:
    - "SUPER"
    - "ELECT"
